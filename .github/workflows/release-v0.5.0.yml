name: Bootstrap v0.5.0 Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.5.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release files
        env:
          RELEASE_SHA: "c9467b1e4a15fb78bfe5cf3f26d680763777c15e"
          VERSION: "v0.5.0"
        run: |
          git archive --format=zip --output="agentic-dataops-copilot-${VERSION}.zip" "${RELEASE_SHA}"
          sha256sum "agentic-dataops-copilot-${VERSION}.zip" > "agentic-dataops-copilot-${VERSION}.zip.sha256"
          awk '/## \[0.5.0\]/{flag=1} /## \[0.4.0\]/{flag=0} flag' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: "c9467b1e4a15fb78bfe5cf3f26d680763777c15e"
          VERSION: "v0.5.0"
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; nothing to do."
            exit 0
          fi

          gh release create "${VERSION}" \
            --target "${RELEASE_SHA}" \
            --title "Agentic DataOps Copilot ${VERSION}" \
            --notes-file release-notes.md \
            "agentic-dataops-copilot-${VERSION}.zip" \
            "agentic-dataops-copilot-${VERSION}.zip.sha256"
